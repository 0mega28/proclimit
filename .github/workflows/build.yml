name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PROCLIMIT_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          PROCLIMIT_KEYSTORE: ${{ runner.temp }}/release.jks
          PROCLIMIT_KEYSTORE_PASSWORD: ${{ secrets.PROCLIMIT_KEYSTORE_PASSWORD }}
          PROCLIMIT_KEY_ALIAS: ${{ secrets.PROCLIMIT_KEY_ALIAS }}
          PROCLIMIT_KEY_PASSWORD: ${{ secrets.PROCLIMIT_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/proclimit-${GITHUB_REF_NAME}.apk"
          rm "$RUNNER_TEMP/release.jks"

      - name: Verify signature and compute fingerprints
        id: fp
        run: |
          APK="dist/proclimit-${GITHUB_REF_NAME}.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs "$APK" | tee certs.txt
          echo "cert=$(grep -m1 'certificate SHA-256 digest' certs.txt | awk '{print $NF}')" >> "$GITHUB_OUTPUT"
          echo "apk=$(sha256sum "$APK" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.apk

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          Signed release APK built by GitHub Actions from commit ${GITHUB_SHA}.

          See the [README](https://github.com/${GITHUB_REPOSITORY}#readme) for the one-time \`adb shell pm grant\` setup.

          **APK SHA-256:** \`${{ steps.fp.outputs.apk }}\`
          **Signing certificate SHA-256:** \`${{ steps.fp.outputs.cert }}\`

          Verify the build provenance:
          \`\`\`
          gh attestation verify proclimit-${GITHUB_REF_NAME}.apk -R ${GITHUB_REPOSITORY}
          \`\`\`
          EOF
          gh release create "$GITHUB_REF_NAME" dist/*.apk --title "ProcLimit $GITHUB_REF_NAME" --notes-file notes.md
